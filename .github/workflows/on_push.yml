name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Run Tests
    runs-on: depot-ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # same node and strict install as the Publish workflow, so a lockfile that npm ci
      # rejects fails here and not in the middle of a release
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Install dependencies
        run: npm ci
      # the desktop tests drive a real hackatime-cli (offline queue, heartbeat sending), so
      # pin a release and check it against the release's published sha256
      - name: Download hackatime-cli
        env:
          CLI_VERSION: v3.0.0
          CLI_SHA256: 0f1449cf9e3dba06f2d986024ab855c84eb96ac35b3077ab5857c9ec35d8ac4e
        run: |
          mkdir -p "$RUNNER_TEMP/hackatime-cli"
          cd "$RUNNER_TEMP/hackatime-cli"
          curl -sSfL -o cli.zip "https://github.com/hackclub/hackatime-cli/releases/download/$CLI_VERSION/hackatime-cli-linux-amd64.zip"
          echo "$CLI_SHA256  cli.zip" | sha256sum -c -
          unzip -q cli.zip
          chmod +x hackatime-cli-linux-amd64
          ./hackatime-cli-linux-amd64 --version
          echo "WAKATIME_CLI_PATH=$RUNNER_TEMP/hackatime-cli/hackatime-cli-linux-amd64" >> "$GITHUB_ENV"
      - name: Unit tests
        run: xvfb-run -a npm test
