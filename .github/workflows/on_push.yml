name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # same node and strict install as the Publish workflow, so a lockfile that npm ci
      # rejects fails here and not in the middle of a release
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Install dependencies
        run: npm ci
      # the desktop tests drive a real wakatime-cli (offline queue, heartbeat sending), so
      # pin a release and check it against the release's published sha256
      - name: Download wakatime-cli
        env:
          CLI_VERSION: v2.28.4
          CLI_SHA256: e1dfa9fc4960cb0ebed90ee978c921b8ded9c61ffa63e750ddabd2fedb570345
        run: |
          mkdir -p "$RUNNER_TEMP/wakatime-cli"
          cd "$RUNNER_TEMP/wakatime-cli"
          curl -sSfL -o cli.zip "https://github.com/wakatime/wakatime-cli/releases/download/$CLI_VERSION/wakatime-cli-linux-amd64.zip"
          echo "$CLI_SHA256  cli.zip" | sha256sum -c -
          unzip -q cli.zip
          chmod +x wakatime-cli-linux-amd64
          ./wakatime-cli-linux-amd64 --version
          echo "WAKATIME_CLI_PATH=$RUNNER_TEMP/wakatime-cli/wakatime-cli-linux-amd64" >> "$GITHUB_ENV"
      - name: Unit tests
        run: xvfb-run -a npm test
