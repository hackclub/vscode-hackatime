name: Publish

# runs when a release tag is pushed (npm run release:tag). publishing uses trusted
# publishing (OIDC) on both registries, so no marketplace tokens are stored anywhere.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Test and package
    runs-on: depot-ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Check the tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$expected" ]; then
            echo "::error::Tag $TAG does not match package.json version $expected"
            exit 1
          fi
      - name: Install dependencies
        run: npm ci
      # same pinned cli as the Tests workflow, checked against the release's sha256
      - name: Download hackatime-cli
        env:
          CLI_VERSION: v3.0.0
          CLI_SHA256: 0f1449cf9e3dba06f2d986024ab855c84eb96ac35b3077ab5857c9ec35d8ac4e
        run: |
          mkdir -p "$RUNNER_TEMP/hackatime-cli"
          cd "$RUNNER_TEMP/hackatime-cli"
          curl -sSfL -o cli.zip "https://github.com/hackclub/hackatime-cli/releases/download/$CLI_VERSION/hackatime-cli-linux-amd64.zip"
          echo "$CLI_SHA256  cli.zip" | sha256sum -c -
          unzip -q cli.zip
          chmod +x hackatime-cli-linux-amd64
          echo "WAKATIME_CLI_PATH=$RUNNER_TEMP/hackatime-cli/hackatime-cli-linux-amd64" >> "$GITHUB_ENV"
      - name: Test
        run: xvfb-run -a npm test
      # packaged once, so both registries get the exact same file
      - name: Package
        run: npx vsce package --allow-star-activation --out hackatime.vsix
      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix
          path: hackatime.vsix
          if-no-files-found: error

  marketplace:
    name: Publish to the VS Code Marketplace
    needs: package
    runs-on: depot-ubuntu-24.04
    # must match the environment in the Marketplace trusted publishing policy
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Install the pinned vsce
        run: npm ci --ignore-scripts
      - name: Download package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix
      - name: Publish
        run: npx vsce publish --oidc --packagePath hackatime.vsix --allow-star-activation --skip-duplicate

  openvsx:
    name: Publish to Open VSX
    needs: package
    runs-on: depot-ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Install the pinned ovsx
        run: npm ci --ignore-scripts
      - name: Download package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix
      - name: Publish
        run: npx ovsx publish hackatime.vsix --trusted-publishing --skip-duplicate

  github-release:
    name: GitHub release
    needs: [marketplace, openvsx]
    runs-on: depot-ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # notes are this version's CHANGELOG.md section
          awk -v heading="## ${TAG#v} " 'index($0, heading) == 1 { found = 1; next } /^## / && found { exit } found' CHANGELOG.md > notes.md
          gh release create "$TAG" "hackatime.vsix#hackatime-${TAG#v}.vsix" --verify-tag --title "$TAG" --notes-file notes.md
